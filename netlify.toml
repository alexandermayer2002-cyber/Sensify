[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_SUPABASE_URL,SUPABASE_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."daily-sms-scheduler"]
  schedule = "0 * * * *"
